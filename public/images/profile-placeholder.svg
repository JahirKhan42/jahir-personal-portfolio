<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <radialGradient id="profileGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F7CFF" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#9061F9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#080B12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="avatarBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F7CFF"/>
      <stop offset="50%" stop-color="#9061F9"/>
      <stop offset="100%" stop-color="#293244"/>
    </linearGradient>
    <linearGradient id="innerPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151E30"/>
      <stop offset="100%" stop-color="#0E1422"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="200" r="190" fill="url(#profileGlow)"/>

  <!-- Orbital Rings -->
  <circle cx="200" cy="200" r="160" stroke="#4F7CFF" stroke-width="1.2" stroke-dasharray="8 6" opacity="0.3"/>
  <ellipse cx="200" cy="200" rx="175" ry="75" stroke="#9061F9" stroke-width="1" stroke-dasharray="5 5" opacity="0.35" transform="rotate(-25 200 200)"/>
  <ellipse cx="200" cy="200" rx="175" ry="75" stroke="#4F7CFF" stroke-width="1" stroke-dasharray="6 8" opacity="0.25" transform="rotate(40 200 200)"/>

  <!-- Orbital Particles -->
  <circle cx="65" cy="140" r="4" fill="#4F7CFF" opacity="0.8"/>
  <circle cx="340" cy="240" r="3" fill="#9061F9" opacity="0.9"/>
  <circle cx="270" cy="70" r="3.5" fill="#F5F7FB" opacity="0.7"/>

  <!-- Center Card Badge / Portrait Base -->
  <rect x="80" y="80" width="240" height="240" rx="36" fill="url(#innerPlate)" stroke="url(#avatarBorder)" stroke-width="2"/>
  
  <!-- Subtle Grid inside Plate -->
  <path d="M80 140 H320 M80 200 H320 M80 260 H320 M140 80 V320 M200 80 V320 M260 80 V320" stroke="#293244" stroke-width="1" opacity="0.4"/>

  <!-- Stylized Monogram Profile Silhouette -->
  <g transform="translate(145, 120)">
    <!-- Stylized User Silhouette -->
    <circle cx="55" cy="45" r="32" fill="#1E293B" stroke="#4F7CFF" stroke-width="2"/>
    <!-- Initials inside head -->
    <text x="55" y="53" text-anchor="middle" fill="#F5F7FB" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="22" letter-spacing="1">JAK</text>
    
    <!-- Torso Shape -->
    <path d="M12 125 C12 95 30 84 55 84 C80 84 98 95 98 125" fill="#1E293B" stroke="#9061F9" stroke-width="2"/>
  </g>

  <!-- Tagline underneath plate -->
  <rect x="110" y="278" width="180" height="26" rx="13" fill="#080B12" stroke="#293244" stroke-width="1"/>
  <text x="200" y="295" text-anchor="middle" fill="#A6B0C3" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" letter-spacing="0.5">JAHIR ALI KHAN</text>
</svg>
