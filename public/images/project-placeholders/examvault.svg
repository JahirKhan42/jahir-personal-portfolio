<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <radialGradient id="evGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#4F7CFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#080B12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B263B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="#0A0E17"/>
  <rect width="600" height="360" fill="url(#evGlow)"/>

  <!-- Matrix Grid -->
  <path d="M50 0 V360 M150 0 V360 M250 0 V360 M350 0 V360 M450 0 V360 M550 0 V360" stroke="#162032" stroke-width="1"/>
  <path d="M0 60 H600 M0 140 H600 M0 220 H600 M0 300 H600" stroke="#162032" stroke-width="1"/>

  <!-- Central Vault & Knowledge Cards -->
  <g transform="translate(110, 60)">
    <!-- Backing Card 1 (Rotated) -->
    <rect x="50" y="10" width="280" height="190" rx="12" fill="#131B2B" stroke="#253248" stroke-width="1" transform="rotate(-6 190 105)"/>
    
    <!-- Backing Card 2 (Rotated opposite) -->
    <rect x="50" y="15" width="280" height="190" rx="12" fill="#162238" stroke="#2B3C58" stroke-width="1" transform="rotate(4 190 110)"/>

    <!-- Main Front Knowledge Card -->
    <rect x="50" y="20" width="280" height="200" rx="14" fill="url(#folderGrad)" stroke="#4F7CFF" stroke-width="1.8"/>

    <!-- Document Header -->
    <rect x="75" y="44" width="36" height="36" rx="8" fill="#1E293B" stroke="#4F7CFF" stroke-width="1.2"/>
    <!-- PDF / Doc icon -->
    <path d="M87 53 H98 V69 H87 Z M87 59 H98" stroke="#4F7CFF" stroke-width="1.5" stroke-linecap="round"/>

    <rect x="124" y="48" width="130" height="10" rx="3" fill="#F5F7FB"/>
    <rect x="124" y="64" width="80" height="7" rx="2" fill="#64748B"/>

    <!-- Structured Modules / Flashcard sections -->
    <rect x="75" y="98" width="230" height="32" rx="6" fill="#0F172A" stroke="#2B3C58" stroke-width="1"/>
    <circle cx="92" cy="114" r="5" fill="#10B981"/>
    <rect x="108" y="110" width="100" height="8" rx="2" fill="#CBD5E1"/>
    <rect x="250" y="108" width="40" height="12" rx="3" fill="#4F7CFF" fill-opacity="0.25"/>

    <rect x="75" y="138" width="230" height="32" rx="6" fill="#0F172A" stroke="#2B3C58" stroke-width="1"/>
    <circle cx="92" cy="154" r="5" fill="#9061F9"/>
    <rect x="108" y="150" width="120" height="8" rx="2" fill="#CBD5E1"/>
    <rect x="250" y="148" width="40" height="12" rx="3" fill="#9061F9" fill-opacity="0.25"/>

    <rect x="75" y="178" width="230" height="26" rx="6" fill="#0F172A" stroke="#232F42" stroke-width="1"/>
    <circle cx="92" cy="191" r="4" fill="#64748B"/>
    <rect x="108" y="188" width="85" height="6" rx="2" fill="#64748B"/>
  </g>

  <!-- Tag badge -->
  <rect x="220" y="300" width="160" height="28" rx="14" fill="#151E30" stroke="#293244" stroke-width="1"/>
  <text x="300" y="318" text-anchor="middle" fill="#A6B0C3" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500">EXAMVAULT • AI EDTECH</text>
</svg>
