<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <radialGradient id="piGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#9061F9" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#4F7CFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#080B12" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="360" fill="#0A0E17"/>
  <rect width="600" height="360" fill="url(#piGlow)"/>

  <!-- Coordinate Grid -->
  <path d="M0 180 H600 M300 0 V360" stroke="#253248" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="300" cy="180" r="110" stroke="#1E2A3E" stroke-width="1.2"/>
  <circle cx="300" cy="180" r="70" stroke="#293954" stroke-width="1.2"/>

  <!-- Harmonic Sine Wave / Field Potential -->
  <path d="M60 180 C 120 70, 180 70, 240 180 C 300 290, 360 290, 420 180 C 480 70, 540 70, 580 140" stroke="#4F7CFF" stroke-width="2.5" fill="none"/>
  
  <!-- Secondary Phase-shifted Wave -->
  <path d="M60 180 C 120 250, 180 250, 240 180 C 300 110, 360 110, 420 180 C 480 250, 540 250, 580 210" stroke="#9061F9" stroke-width="2" stroke-dasharray="6 4" fill="none" opacity="0.8"/>

  <!-- Physics Field Vectors & Force Markers -->
  <!-- Vector 1 -->
  <line x1="240" y1="180" x2="240" y2="100" stroke="#38BDF8" stroke-width="2"/>
  <polygon points="237,102 243,102 240,92" fill="#38BDF8"/>
  <circle cx="240" cy="180" r="4" fill="#38BDF8"/>
  <text x="248" y="115" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">F(x)</text>

  <!-- Vector 2 -->
  <line x1="360" y1="180" x2="360" y2="250" stroke="#C084FC" stroke-width="2"/>
  <polygon points="357,248 363,248 360,258" fill="#C084FC"/>
  <circle cx="360" cy="180" r="4" fill="#C084FC"/>
  <text x="368" y="245" fill="#C084FC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">∇ψ</text>

  <!-- Orbital Body -->
  <circle cx="300" cy="180" r="10" fill="#151E30" stroke="#4F7CFF" stroke-width="2"/>
  <circle cx="300" cy="180" r="4" fill="#F5F7FB"/>

  <!-- Tangent velocity -->
  <line x1="300" y1="110" x2="370" y2="110" stroke="#F59E0B" stroke-width="2"/>
  <polygon points="368,107 368,113 378,110" fill="#F59E0B"/>
  <text x="340" y="102" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">v_tan</text>

  <!-- Formula / Concept Badge -->
  <rect x="200" y="295" width="200" height="30" rx="15" fill="#151E30" stroke="#293244" stroke-width="1"/>
  <text x="300" y="315" text-anchor="middle" fill="#CBD5E1" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">PHYSICS INTUITION ENGINE</text>
</svg>
