<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <radialGradient id="qcGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9061F9" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#4F7CFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#080B12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F7CFF"/>
      <stop offset="100%" stop-color="#9061F9"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="#0A0E17"/>
  <rect width="600" height="360" fill="url(#qcGlow)"/>

  <!-- Science Strategy Visual Grid -->
  <circle cx="300" cy="180" r="140" stroke="#1F2A3F" stroke-width="1.5"/>
  <circle cx="300" cy="180" r="100" stroke="#29354F" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="300" cy="180" r="60" stroke="#4F7CFF" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Energy Probability Waves -->
  <path d="M120 180 Q 210 120, 300 180 T 480 180" stroke="#9061F9" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M120 180 Q 210 240, 300 180 T 480 180" stroke="#4F7CFF" stroke-width="2" fill="none" opacity="0.8"/>

  <!-- Quantum Nodes -->
  <g transform="translate(300, 180)">
    <circle cx="0" cy="0" r="16" fill="#151E30" stroke="url(#orbitGrad)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="6" fill="#F5F7FB"/>
    
    <!-- Player/Energy Nodes -->
    <g transform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="-100" stroke="#4F7CFF" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
      <circle cx="0" cy="-100" r="9" fill="#101827" stroke="#4F7CFF" stroke-width="2"/>
      <circle cx="0" cy="-100" r="4" fill="#4F7CFF"/>
    </g>
    <g transform="rotate(135)">
      <line x1="0" y1="0" x2="0" y2="-100" stroke="#9061F9" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
      <circle cx="0" cy="-100" r="9" fill="#101827" stroke="#9061F9" stroke-width="2"/>
      <circle cx="0" cy="-100" r="4" fill="#9061F9"/>
    </g>
    <g transform="rotate(225)">
      <line x1="0" y1="0" x2="0" y2="-100" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
      <circle cx="0" cy="-100" r="9" fill="#101827" stroke="#38BDF8" stroke-width="2"/>
      <circle cx="0" cy="-100" r="4" fill="#38BDF8"/>
    </g>
    <g transform="rotate(315)">
      <line x1="0" y1="0" x2="0" y2="-100" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
      <circle cx="0" cy="-100" r="9" fill="#101827" stroke="#A78BFA" stroke-width="2"/>
      <circle cx="0" cy="-100" r="4" fill="#A78BFA"/>
    </g>
  </g>

  <!-- Overlay HUD Elements -->
  <rect x="50" y="30" width="150" height="32" rx="6" fill="#151E30" stroke="#293244" stroke-width="1"/>
  <text x="65" y="51" fill="#4F7CFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">ROUND 03 / 05</text>
  
  <rect x="420" y="30" width="130" height="32" rx="6" fill="#151E30" stroke="#293244" stroke-width="1"/>
  <text x="435" y="51" fill="#9061F9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">ENERGY: 85 MeV</text>
</svg>
